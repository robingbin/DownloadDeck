<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px "Segoe UI",sans-serif;width:250px;margin:12px;color:#222}
h1{font-size:15px;margin:0 0 10px;color:#1e7a43}
label{display:flex;align-items:center;gap:6px;margin:8px 0}
input[type=number]{width:80px}
#st{font-size:12px;margin-top:10px}.ok{color:#1e7a43}.bad{color:#c62828}
</style></head><body>
<h1>DownloadDeck</h1>
<label><input type="checkbox" id="enabled"> Capture browser downloads</label>
<label>Skip files under <input type="number" id="minSizeKB" min="0"> KB</label>
<label>App port <input type="number" id="port" min="1024" max="65535"></label>
<button id="grab" style="width:100%;padding:7px;margin:4px 0 2px;border:1px solid #155c32;border-radius:4px;background:#2e9a57;color:#fff;font-weight:600;cursor:pointer">Grab video from this tab</button>
<div id="st">Checking app...</div>
<script src="popup.js"></script>
</body></html>
